aid: sevdesk
url: https://raw.githubusercontent.com/api-evangelist/sevdesk/refs/heads/main/apis.yml
name: sevdesk
kind: company
description: sevdesk is a German cloud accounting, invoicing, and bookkeeping
  platform for freelancers and small businesses. Its RESTful API (base
  https://my.sevdesk.de/api/v1) exposes everything the web application does -
  contacts, invoices, orders, credit notes, vouchers (receipts), bank check
  accounts and transactions, parts (inventory), tags, plus DATEV and CSV
  exports - authenticated with a per-administrator API token passed in the
  Authorization header. Nested resources can be pulled in with the embed query
  parameter.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Accounting
- Invoicing
- Bookkeeping
- Finance
- Germany
- Vouchers
- Contacts
- SaaS
- ERP
- Financial Software
