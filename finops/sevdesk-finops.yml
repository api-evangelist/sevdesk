description: >-
  FinOps view of sevdesk spend. sevdesk is a per-account SaaS subscription
  billed in EUR (net, plus German VAT), with tiers priced by feature depth -
  Rechnung, Buchhaltung, Buchhaltung Pro, and Warenwirtschaft. The API is
  included in the subscription with no separate API line item and no per-call
  charge, so API usage does not directly drive cost. The dominant cost levers are
  which plan tier an account is on, the contract term (flexible monthly vs 12/24
  month terms that lower the monthly price), and the number of separate sevdesk
  accounts an organisation runs.
notes: >-
  Per-unit prices are not reconciled here; verify current EUR tier prices, VAT
  handling, and contract-term discounts on sevdesk.de/preise. Because billing is
  a flat per-account subscription rather than metered usage, FinOps attention is
  best spent on right-sizing the plan tier and consolidating accounts, not on API
  call volume.
