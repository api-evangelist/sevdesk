meters:
- name: subscription
  description: Flat monthly (or annual) per-account subscription fee for the chosen sevdesk plan tier, in EUR plus VAT.
  unit: account-months
  aggregation: sum
  dimensions:
  - account
  - plan_tier
  - contract_term
- name: api_calls
  description: REST API calls. Included in the subscription at no additional charge; tracked for visibility only, not billed.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
principles:
- name: Visibility
  description: Track how many sevdesk accounts exist and which plan tier each is on; API call volume is not billed but is worth monitoring for integration health.
- name: Allocation
  description: Map each sevdesk account and its subscription to the owning team, client, or legal entity so the flat fee lands on the right cost center.
- name: Optimization
  description: Right-size the plan tier to the features actually used (invoicing vs full accounting vs inventory), consolidate redundant accounts, and choose a 12/24-month term when usage is committed to cut the monthly rate.
- name: Accountability
  description: Assign an owner per sevdesk account to review the tier and contract term at renewal against actual usage.
